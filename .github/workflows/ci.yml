name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: >-
          sudo apt-get update && sudo apt-get install --yes aria2 ffmpeg
          xvfb xclip sway wl-clipboard dbus libnss3-tools
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
        env:
          SAYL_LARGE_TEST: "1"
          SAYL_REQUIRE_TOOLS: "1"  # Xvfb, headless sway, a private bus, and certutil must exist.
      - run: uv run pytest -m timing --no-cov

  capture-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        protocol: [http1, http2]
        target: [poc, daemon, capture]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install --yes aria2
      - run: uv sync --locked
      - name: Install Chromium
        if: matrix.browser == 'chromium'
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/playwright" playwright-core@1.63.0
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright-core" install --with-deps chromium
          echo "PLAYWRIGHT_CORE=$RUNNER_TEMP/playwright/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr
      - run: >-
          uv run python poc/lab/run_matrix.py ${{ matrix.browser }} ${{ matrix.protocol }}
          --target ${{ matrix.target }}

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter sayl-desktop lint
      - run: pnpm --filter sayl-desktop typecheck
      - run: pnpm --filter sayl-desktop test
      - name: Generated API client matches docs/openapi.json
        run: pnpm --filter sayl-desktop api && git diff --exit-code desktop/src/lib/api/schema.d.ts
      - run: pnpm --filter sayl-desktop build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-out
          path: desktop/out
          retention-days: 3

  tauri:
    runs-on: ubuntu-24.04
    needs: desktop
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - run: >-
          sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # generate_context! embeds the static export, so the shell compiles against the real one.
      - uses: actions/download-artifact@v8
        with:
          name: desktop-out
          path: desktop/out
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: success() || failure()
      - run: cargo test --locked
        if: success() || failure()
