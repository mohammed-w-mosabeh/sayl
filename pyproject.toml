[project]
name = "sayl"
version = "0.0.0"
description = "IDM-class download manager for Linux that captures browser downloads without an extension."
readme = "docs/SPEC.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "alembic>=1.14",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring>=25",
    "rich>=13.9",
    "sqlmodel>=0.0.22",
    "typer>=0.15",
    "uvicorn>=0.32",
    "websockets>=13",
    "yt-dlp>=2026.10.26",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
sayl = "cli.main:app"
sayld = "daemon.main:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
capture = [
    # Exact pin: daemon/capture/mitm_adapter.py patches internals of this version.
    # Upgrade procedure: docs/SPEC.md, "Upgrading mitmproxy".
    "mitmproxy==12.3.1",
]

[tool.uv]
default-groups = ["dev", "capture"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daemon", "cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["desktop"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC", "C4", "PTH", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ASYNC110", "ASYNC240"]
"poc/test_*.py" = ["S101"]
"poc/addon.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["daemon", "cli"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=daemon --cov=cli --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
# Exercised end to end by the capture-lab CI matrix, not by pytest.
omit = ["daemon/capture/mitm_adapter.py"]
