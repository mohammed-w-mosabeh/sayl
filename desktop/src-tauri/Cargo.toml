[package]
name = "sayl-desktop"
version = "1.0.0"
description = "Sayl desktop app"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sayl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
